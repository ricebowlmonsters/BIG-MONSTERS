<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RBM Input Point</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="custom-ui.js"></script>
  <script src="firebase-storage.js"></script>
  <script>
    // [PERBAIKAN] Pastikan halaman login tidak terbuka di dalam iframe (mencegah error index ganda)
    try {
      if (window.self !== window.top) {
        if (window.location.protocol !== 'file:') {
          window.top.location = window.self.location;
        }
      }
    } catch(e) {}
  </script>
</head>
<body>
  <div class="app-container">
    <header class="app-header simple">
      <h1 class="page-title">Login</h1>
    </header>
    <main class="content">
      <section class="card">
        <h3 class="card-title">Masuk ke Modul Input Point</h3>
        <div id="login-status" class="status-info" style="display:none;"></div>
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input id="login-username" class="form-input" placeholder="user" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input id="login-password" type="password" class="form-input" placeholder="••••••" autocomplete="current-password">
        </div>
        <button id="btn-login" class="btn btn-primary">Masuk</button>
      </section>
    </main>
  </div>

  <script>
    // Minimal inline to avoid dependency before app.js loads
    document.addEventListener('DOMContentLoaded', () => {
      const status = document.getElementById('login-status');
      const show = (msg, type='info') => {
        status.style.display = 'block';
        status.className = 'status-' + type;
        status.textContent = msg;
      };
      const username = document.getElementById('login-username');
      const password = document.getElementById('login-password');
      const submit = async () => {
        try {
          // [DIUBAH] Logika login diperbarui agar membaca data user terbaru (rbm_users)
          // Menggantikan ketergantungan pada window.AUTH yang mungkin belum sinkron
          const inputUser = username.value.trim();
          const inputPass = password.value.trim();

          // [BARU] Akun Owner Tersembunyi (Hardcoded di Script)
          // Akun ini tidak masuk ke database user (localStorage) sehingga tidak terlihat user lain
          if (inputUser.toLowerCase() === 'burhan' && inputPass === '160502') {
            const hiddenUser = { username: 'Burhan', nama: 'Puji Shohibul Burhan (Developer)', role: 'owner', outlet: 'all' };
            const sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2);
            localStorage.setItem('rbm_session_id', sessionId);
            localStorage.setItem('rbm_user', JSON.stringify(hiddenUser));
            if (typeof ensureDefaultFirebaseConnection === 'function') ensureDefaultFirebaseConnection();
            if (typeof FirebaseStorage !== 'undefined' && FirebaseStorage.setActiveSession) {
              FirebaseStorage.setActiveSession('Burhan', sessionId).then(() => {});
            }
            // [BARU] Tampilkan animasi sambutan khusus Owner
            const welcomeScreen = document.getElementById('owner-welcome');
            if (welcomeScreen) {
              welcomeScreen.style.display = 'flex';
              setTimeout(() => { window.top.location.href = 'index.html'; }, 7000);
            } else {
              show('Login berhasil', 'success');
              setTimeout(() => { window.top.location.href = 'index.html'; }, 500);
            }
            return;
          }

          const users = JSON.parse(localStorage.getItem('rbm_users') || '[]');
          
          // Cari user yang cocok (username tidak case-sensitive)
          const user = users.find(u => u.username.toLowerCase() === inputUser.toLowerCase() && u.password === inputPass);

          if (user) {
            const sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2);
            localStorage.setItem('rbm_session_id', sessionId);
            localStorage.setItem('rbm_user', JSON.stringify(user)); // Simpan sesi login
            if (typeof ensureDefaultFirebaseConnection === 'function') ensureDefaultFirebaseConnection();
            if (typeof FirebaseStorage !== 'undefined' && FirebaseStorage.setActiveSession) {
              FirebaseStorage.setActiveSession(user.username, sessionId).then(() => {});
            }
            show('Login berhasil', 'success');
            setTimeout(() => { window.top.location.href = 'index.html'; }, 500);
          } else {
            show('Username atau password salah', 'error');
          }
        } catch (e) {
          show('Terjadi kesalahan saat login', 'error');
        }
      };
      document.getElementById('btn-login').addEventListener('click', submit);
      password.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });
    });
  </script>
  <script src="app.js"></script>

  <!-- [BARU] Animasi Sambutan Khusus Owner -->
  <div id="owner-welcome" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:9999; align-items:center; justify-content:center; flex-direction:column; color:white; text-align:center;">
    <div style="font-size:64px; margin-bottom:20px; animation: bounce 2s infinite;">👑</div>
    <h1 style="font-size:32px; margin:0; animation: fadeInDown 1s ease-out;">Selamat Datang Sayang, Semangat Ya</h1>
    <div class="developer-name" aria-label="Puji Shohibul Burhan">
      <span class="developer-letter">P</span><span class="developer-letter">u</span><span class="developer-letter">j</span><span class="developer-letter">i</span>
      <span class="developer-letter developer-space"> </span>
      <span class="developer-letter">S</span><span class="developer-letter">h</span><span class="developer-letter">o</span><span class="developer-letter">h</span><span class="developer-letter">i</span><span class="developer-letter">b</span><span class="developer-letter">u</span><span class="developer-letter">l</span>
      <span class="developer-letter developer-space"> </span>
      <span class="developer-letter">B</span><span class="developer-letter">u</span><span class="developer-letter">r</span><span class="developer-letter">h</span><span class="developer-letter">a</span><span class="developer-letter">n</span>
    </div>
    <p class="developer-quote">"Lakukan rutinitas pekerjaanmu dengan cinta. Jika kamu tidak bisa menjalani rutinitasmu dengan cinta, lebih baik tinggalkan saja."</p>
    <p style="color:#94a3b8; margin-top:10px; font-family:monospace; animation: fadeInUp 1s ease-out 0.5s backwards;">> Access Level: OWNER / DEVELOPER_</p>
    <div style="margin-top:30px; width:200px; height:4px; background:#334155; border-radius:2px; overflow:hidden;">
      <div style="width:100%; height:100%; background:#4C2A85; animation: loading 7s linear;"></div>
    </div>
  </div>
  <style>
    .developer-name {
      display: flex;
      justify-content: center;
      margin: 24px 20px 0;
      color: #fff;
      font-size: clamp(25px, 6vw, 46px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 0 rgba(255,255,255,0);
      white-space: pre;
    }
    .developer-letter {
      display: inline-block;
      min-width: 0.58em;
      opacity: 0;
      transform: translate(var(--scatter-x), var(--scatter-y)) rotate(var(--scatter-rotate)) scale(1.7);
      animation: gatherDeveloperName 4.8s cubic-bezier(0.22, 1, 0.36, 1) forwards, developerNameGlow 2.2s ease-in-out 4.8s infinite alternate;
    }
    .developer-space {
      min-width: 0.3em;
    }
    .developer-quote {
      max-width: 620px;
      margin: 8px 24px 0;
      color: #cbd5e1;
      font-size: clamp(14px, 2.5vw, 18px);
      font-style: italic;
      line-height: 1.6;
      animation: quoteReveal 2.4s ease-out 0.8s both;
    }
    .developer-letter:nth-child(1) { --scatter-x: -110px; --scatter-y: -75px; --scatter-rotate: -28deg; }
    .developer-letter:nth-child(2) { --scatter-x: -72px; --scatter-y: 68px; --scatter-rotate: 22deg; animation-delay: 0.04s, 2.24s; }
    .developer-letter:nth-child(3) { --scatter-x: -38px; --scatter-y: -92px; --scatter-rotate: -16deg; animation-delay: 0.08s, 2.28s; }
    .developer-letter:nth-child(4) { --scatter-x: 20px; --scatter-y: 82px; --scatter-rotate: 31deg; animation-delay: 0.12s, 2.32s; }
    .developer-letter:nth-child(5) { --scatter-x: 105px; --scatter-y: -60px; --scatter-rotate: -24deg; animation-delay: 0.16s, 2.36s; }
    .developer-letter:nth-child(6) { --scatter-x: -145px; --scatter-y: 32px; --scatter-rotate: 18deg; animation-delay: 0.2s, 2.4s; }
    .developer-letter:nth-child(7) { --scatter-x: -98px; --scatter-y: -110px; --scatter-rotate: -35deg; animation-delay: 0.24s, 2.44s; }
    .developer-letter:nth-child(8) { --scatter-x: -48px; --scatter-y: 105px; --scatter-rotate: 27deg; animation-delay: 0.28s, 2.48s; }
    .developer-letter:nth-child(9) { --scatter-x: 2px; --scatter-y: -118px; --scatter-rotate: -19deg; animation-delay: 0.32s, 2.52s; }
    .developer-letter:nth-child(10) { --scatter-x: 52px; --scatter-y: 96px; --scatter-rotate: 34deg; animation-delay: 0.36s, 2.56s; }
    .developer-letter:nth-child(11) { --scatter-x: 112px; --scatter-y: -98px; --scatter-rotate: -29deg; animation-delay: 0.4s, 2.6s; }
    .developer-letter:nth-child(12) { --scatter-x: 152px; --scatter-y: 42px; --scatter-rotate: 21deg; animation-delay: 0.44s, 2.64s; }
    .developer-letter:nth-child(13) { --scatter-x: -175px; --scatter-y: -18px; --scatter-rotate: -32deg; animation-delay: 0.48s, 2.68s; }
    .developer-letter:nth-child(14) { --scatter-x: 176px; --scatter-y: -28px; --scatter-rotate: 26deg; animation-delay: 0.52s, 2.72s; }
    .developer-letter:nth-child(15) { --scatter-x: -128px; --scatter-y: 115px; --scatter-rotate: -22deg; animation-delay: 0.56s, 2.76s; }
    .developer-letter:nth-child(16) { --scatter-x: 132px; --scatter-y: 105px; --scatter-rotate: 36deg; animation-delay: 0.6s, 2.8s; }
    .developer-letter:nth-child(17) { --scatter-x: -30px; --scatter-y: -135px; --scatter-rotate: -18deg; animation-delay: 0.64s, 2.84s; }
    .developer-letter:nth-child(18) { --scatter-x: 35px; --scatter-y: 138px; --scatter-rotate: 29deg; animation-delay: 0.68s, 2.88s; }
    .developer-letter:nth-child(19) { --scatter-x: -195px; --scatter-y: -88px; --scatter-rotate: -27deg; animation-delay: 0.72s, 2.92s; }
    .developer-letter:nth-child(20) { --scatter-x: 198px; --scatter-y: 78px; --scatter-rotate: 24deg; animation-delay: 0.76s, 2.96s; }
    .developer-letter { animation-delay: 0s, 4.8s; }
    @keyframes gatherDeveloperName {
      0% { opacity: 0; transform: translate(var(--scatter-x), var(--scatter-y)) rotate(var(--scatter-rotate)) scale(1.7); filter: blur(7px); }
      65% { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); filter: blur(0); }
    }
    @keyframes developerNameGlow {
      from { text-shadow: 0 0 8px rgba(255,255,255,0.45), 0 0 18px rgba(96,165,250,0.45); }
      to { text-shadow: 0 0 14px rgba(255,255,255,0.95), 0 0 34px rgba(96,165,250,0.9), 0 0 54px rgba(129,140,248,0.55); }
    }
    @keyframes quoteReveal {
      from { opacity: 0; transform: translateY(18px); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .developer-letter { opacity: 1; transform: none; animation: developerNameGlow 1.8s ease-in-out infinite alternate; }
    }
    @keyframes fadeInDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-20px);} 60% {transform: translateY(-10px);} }
    @keyframes loading { from { width:0%; } to { width:100%; } }
  </style>
</body>
</html>
